name: Release All

on:
  workflow_dispatch:
    inputs:
      echoai_version:
        description: 'EchoAI version (e.g. 0.3.0, leave empty to skip)'
        required: false
        type: string
      echocode_version:
        description: 'EchoCode version (e.g. 0.1.0, leave empty to skip)'
        required: false
        type: string
      echowork_version:
        description: 'EchoWork version (e.g. 0.2.1, leave empty to skip)'
        required: false
        type: string
      officecli_version:
        description: 'OfficeCli version (e.g. 0.1.0, leave empty to skip)'
        required: false
        type: string
permissions:
  contents: write

jobs:
  resolve-source-refs:
    runs-on: ubuntu-latest
    outputs:
      echoai_ref: ${{ steps.resolve.outputs.echoai_ref }}
      echocode_ref: ${{ steps.resolve.outputs.echocode_ref }}
      echomemory_ref: ${{ steps.resolve.outputs.echomemory_ref }}
      echowork_ref: ${{ steps.resolve.outputs.echowork_ref }}
      officecli_ref: ${{ steps.resolve.outputs.officecli_ref }}
    steps:
      - name: Resolve selected product source refs
        id: resolve
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          ECHOAI_VERSION: ${{ inputs.echoai_version }}
          ECHOCODE_VERSION: ${{ inputs.echocode_version }}
          ECHOWORK_VERSION: ${{ inputs.echowork_version }}
          OFFICECLI_VERSION: ${{ inputs.officecli_version }}
        run: |
          set -euo pipefail
          resolve() {
            local output="$1" repo="$2" sha
            sha=$(gh api "repos/EchoWorker/${repo}/git/ref/heads/main" --jq '.object.sha')
            echo "${output}=${sha}" >> "$GITHUB_OUTPUT"
            echo "- ${repo}: \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"
          }
          echo '### Resolved source refs' >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$ECHOAI_VERSION" || -n "$ECHOCODE_VERSION" ]]; then
            resolve echoai_ref EchoAI
          fi
          if [[ -n "$ECHOAI_VERSION" || -n "$ECHOCODE_VERSION" ]]; then
            resolve echocode_ref EchoCodeRust
            resolve echomemory_ref EchoMemoryRust
          fi
          if [[ -n "$ECHOWORK_VERSION" ]]; then resolve echowork_ref EchoWork; fi
          if [[ -n "$OFFICECLI_VERSION" ]]; then resolve officecli_ref OfficeCli; fi

  validate-pinned-echoai-resources:
    if: github.event_name == 'workflow_dispatch' && (inputs.echoai_version != '' || inputs.echocode_version != '')
    needs: resolve-source-refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: EchoAIStore
      - uses: actions/checkout@v4
        with:
          repository: EchoWorker/EchoAI
          ref: ${{ needs.resolve-source-refs.outputs.echoai_ref }}
          path: EchoAI
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: Verify EchoAI's pinned Resources release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          GENERATED=EchoAI/src/resources/generated.rs
          test -f "$GENERATED" || { echo "$GENERATED is missing" >&2; exit 1; }
          TAG=$(python - "$GENERATED" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          tags = set(re.findall(r'https://github\.com/EchoWorker/EchoAIStore/releases/download/(echoai-resources-v[^/" ]+)/', text))
          if len(tags) != 1:
              raise SystemExit(f"expected exactly one pinned EchoAI Resources release tag, found: {sorted(tags)}")
          print(tags.pop())
          PY
          )
          echo "Pinned Resources release: $TAG" >> "$GITHUB_STEP_SUMMARY"
          mkdir release-files
          gh release download "$TAG" --repo EchoWorker/EchoAIStore --pattern manifest.json --dir release-files
          python EchoAIStore/scripts/resources/generate_rust.py --manifest release-files/manifest.json --output candidate.rs
          cmp candidate.rs "$GENERATED"

  # ─────────────────────────────────────────────
  # EchoAI Build (3 platforms)
  # ─────────────────────────────────────────────
  build-echoai:
    if: github.event_name == 'workflow_dispatch' && inputs.echoai_version != ''
    name: EchoAI (${{ matrix.target }})
    needs: [resolve-source-refs, validate-pinned-echoai-resources]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: echoai-windows-x64.zip
            binary: echoai.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: echoai-linux-x64.tar.gz
            binary: echoai
          - os: macos-14
            target: aarch64-apple-darwin
            archive: echoai-darwin-arm64.tar.gz
            binary: echoai

    steps:
      - uses: actions/checkout@v4
        with:
          repository: EchoWorker/EchoAI
          ref: ${{ needs.resolve-source-refs.outputs.echoai_ref }}
          path: EchoAI
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: EchoWorker/EchoCodeRust
          ref: ${{ needs.resolve-source-refs.outputs.echocode_ref }}
          path: EchoCodeRust
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: EchoWorker/EchoMemoryRust
          ref: ${{ needs.resolve-source-refs.outputs.echomemory_ref }}
          path: EchoMemoryRust
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Record source provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Product source provenance'
            echo "- EchoAI: \`$(git -C EchoAI rev-parse HEAD)\`"
            echo "- EchoCodeRust: \`$(git -C EchoCodeRust rev-parse HEAD)\`"
            echo "- EchoMemoryRust: \`$(git -C EchoMemoryRust rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            EchoAI/target
          key: echoai-${{ matrix.target }}-${{ hashFiles('EchoAI/Cargo.lock') }}
          restore-keys: echoai-${{ matrix.target }}-

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Override EchoAI version
        working-directory: EchoAI
        shell: bash
        run: |
          VERSION="${{ inputs.echoai_version }}"
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml && rm -f Cargo.toml.bak
          echo "Set EchoAI version to $VERSION"
          head -5 Cargo.toml

      - name: Build release
        working-directory: EchoAI
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        working-directory: EchoAI
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} .
          tar czf ${{ matrix.archive }} ${{ matrix.binary }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: EchoAI
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" .
          # Bundle VC++ Runtime DLLs so users don't need to install redistributable
          $vcToolsDir = & vswhere -latest -property installationPath
          $vcRedistDir = Join-Path $vcToolsDir "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT"
          $crtDir = (Resolve-Path $vcRedistDir | Select-Object -First 1).Path
          Copy-Item "$crtDir\msvcp140.dll" .
          Copy-Item "$crtDir\msvcp140_1.dll" .
          Copy-Item "$crtDir\vcruntime140.dll" .
          Copy-Item "$crtDir\vcruntime140_1.dll" .
          Compress-Archive -Path ${{ matrix.binary }},msvcp140.dll,msvcp140_1.dll,vcruntime140.dll,vcruntime140_1.dll -DestinationPath ${{ matrix.archive }}

      - name: Scan EchoAI archive for bundled models
        working-directory: EchoAI
        shell: bash
        run: |
          set -euo pipefail
          mkdir scan
          case '${{ matrix.archive }}' in *.zip) unzip -q '${{ matrix.archive }}' -d scan;; *) tar xzf '${{ matrix.archive }}' -C scan;; esac
          if find scan -type f \( -name '*.onnx' -o -name 'tokenizer.json' \) -print -quit | grep -q . || find scan -type d -name models -print -quit | grep -q .; then
            echo 'Product archive contains forbidden model files' >&2; find scan -print; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: EchoAI/${{ matrix.archive }}

  # ─────────────────────────────────────────────
  # EchoCode Build (3 platforms)
  # ─────────────────────────────────────────────
  build-echocode:
    if: github.event_name == 'workflow_dispatch' && inputs.echocode_version != ''
    name: EchoCode (${{ matrix.target }})
    needs: [resolve-source-refs, validate-pinned-echoai-resources]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: echocode-windows-x64.zip
            binary: echo-code.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: echocode-linux-x64.tar.gz
            binary: echo-code
          - os: macos-14
            target: aarch64-apple-darwin
            archive: echocode-darwin-arm64.tar.gz
            binary: echo-code

    steps:
      - uses: actions/checkout@v4
        with:
          repository: EchoWorker/EchoCodeRust
          ref: ${{ needs.resolve-source-refs.outputs.echocode_ref }}
          path: EchoCodeRust
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: EchoWorker/EchoAI
          ref: ${{ needs.resolve-source-refs.outputs.echoai_ref }}
          path: EchoAI
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: EchoWorker/EchoMemoryRust
          ref: ${{ needs.resolve-source-refs.outputs.echomemory_ref }}
          path: EchoMemoryRust
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Record source provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Product source provenance'
            echo "- EchoAI: \`$(git -C EchoAI rev-parse HEAD)\`"
            echo "- EchoCodeRust: \`$(git -C EchoCodeRust rev-parse HEAD)\`"
            echo "- EchoMemoryRust: \`$(git -C EchoMemoryRust rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            EchoCodeRust/target
          key: echocode-${{ matrix.target }}-${{ hashFiles('EchoCodeRust/Cargo.lock') }}
          restore-keys: echocode-${{ matrix.target }}-

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Override EchoCode version
        working-directory: EchoCodeRust
        shell: bash
        run: |
          VERSION="${{ inputs.echocode_version }}"
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml && rm -f Cargo.toml.bak
          echo "Set EchoCode version to $VERSION"
          head -5 Cargo.toml

      - name: Build release
        working-directory: EchoCodeRust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        working-directory: EchoCodeRust
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} .
          tar czf ${{ matrix.archive }} ${{ matrix.binary }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: EchoCodeRust
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" .
          # Bundle VC++ Runtime DLLs
          $vcToolsDir = & vswhere -latest -property installationPath
          $vcRedistDir = Join-Path $vcToolsDir "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT"
          $crtDir = (Resolve-Path $vcRedistDir | Select-Object -First 1).Path
          Copy-Item "$crtDir\msvcp140.dll" .
          Copy-Item "$crtDir\msvcp140_1.dll" .
          Copy-Item "$crtDir\vcruntime140.dll" .
          Copy-Item "$crtDir\vcruntime140_1.dll" .
          Compress-Archive -Path ${{ matrix.binary }},msvcp140.dll,msvcp140_1.dll,vcruntime140.dll,vcruntime140_1.dll -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: EchoCodeRust/${{ matrix.archive }}

  # ─────────────────────────────────────────────
  # OfficeCli Build (3 platforms)
  # ─────────────────────────────────────────────
  build-officecli:
    if: github.event_name == 'workflow_dispatch' && inputs.officecli_version != ''
    name: OfficeCli (${{ matrix.target }})
    needs: resolve-source-refs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: officecli-windows-x64.zip
            binary: officecli.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: officecli-linux-x64.tar.gz
            binary: officecli
          - os: macos-14
            target: aarch64-apple-darwin
            archive: officecli-darwin-arm64.tar.gz
            binary: officecli

    steps:
      - uses: actions/checkout@v4
        with:
          repository: EchoWorker/OfficeCli
          ref: ${{ needs.resolve-source-refs.outputs.officecli_ref }}
          path: OfficeCli
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Record source provenance
        shell: bash
        run: |
          echo "- OfficeCli: \`$(git -C OfficeCli rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            OfficeCli/ooxml-rs/target
          key: officecli-${{ matrix.target }}-${{ hashFiles('OfficeCli/ooxml-rs/Cargo.lock') }}
          restore-keys: officecli-${{ matrix.target }}-

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Override OfficeCli version
        working-directory: OfficeCli/ooxml-rs/apps/officecli
        shell: bash
        run: |
          VERSION="${{ inputs.officecli_version }}"
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml && rm -f Cargo.toml.bak
          echo "Set OfficeCli version to $VERSION"
          head -5 Cargo.toml

      - name: Build release
        working-directory: OfficeCli/ooxml-rs
        run: cargo build --release --target ${{ matrix.target }} -p officecli

      - name: Package (Unix)
        if: runner.os != 'Windows'
        working-directory: OfficeCli/ooxml-rs
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} .
          tar czf ${{ matrix.archive }} ${{ matrix.binary }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: OfficeCli/ooxml-rs
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" .
          # Bundle VC++ Runtime DLLs
          $vcToolsDir = & vswhere -latest -property installationPath
          $vcRedistDir = Join-Path $vcToolsDir "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT"
          $crtDir = (Resolve-Path $vcRedistDir | Select-Object -First 1).Path
          Copy-Item "$crtDir\msvcp140.dll" .
          Copy-Item "$crtDir\msvcp140_1.dll" .
          Copy-Item "$crtDir\vcruntime140.dll" .
          Copy-Item "$crtDir\vcruntime140_1.dll" .
          Compress-Archive -Path ${{ matrix.binary }},msvcp140.dll,msvcp140_1.dll,vcruntime140.dll,vcruntime140_1.dll -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: OfficeCli/ooxml-rs/${{ matrix.archive }}

  # ─────────────────────────────────────────────
  # EchoWork Build (2 platforms)
  # ─────────────────────────────────────────────
  build-echowork:
    if: ${{ github.event_name == 'workflow_dispatch' && !failure() && !cancelled() && inputs.echowork_version != '' }}
    name: EchoWork (${{ matrix.platform }})
    needs: [resolve-source-refs, build-echoai]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            echoai_archive: echoai-windows-x64.zip
          - platform: macos-arm
            os: macos-latest
            target: aarch64-apple-darwin
            echoai_archive: echoai-darwin-arm64.tar.gz

    steps:
      - name: Checkout EchoWork
        uses: actions/checkout@v4
        with:
          repository: EchoWorker/EchoWork
          ref: ${{ needs.resolve-source-refs.outputs.echowork_ref }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Record source provenance
        shell: bash
        run: |
          echo "- EchoWork: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # EchoWork's Tauri backend depends on `ooxml-facade` from the PRIVATE
      # EchoWorker/OfficeCli repo as a pinned git dependency (https:// URL).
      # CI authenticates that fetch by rewriting the plain https URL to an
      # x-access-token https URL using REPO_ACCESS_TOKEN (the same PAT used to
      # checkout private repos above; it has read access to OfficeCli).
      # Combined with `net.git-fetch-with-cli = true` in EchoWork's
      # src-tauri/.cargo/config.toml, cargo delegates the fetch to the system
      # git, which applies this insteadOf rewrite. Local dev is unaffected
      # (no such rewrite there -> git credential helper / ssh).
      - name: Authenticate cargo git deps (private OfficeCli)
        shell: bash
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: echowork-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: echowork-${{ matrix.target }}-

      - run: npm ci

      - name: Download EchoAI artifact (from this workflow)
        if: github.event_name == 'workflow_dispatch' && inputs.echoai_version != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.echoai_archive }}
          path: echoai-artifact

      - name: Download EchoAI artifact (from latest release)
        if: inputs.echoai_version == ''
        shell: bash
        run: |
          set -eo pipefail
          ARCHIVE="${{ matrix.echoai_archive }}"
          # Get latest EchoAI release tag (tags start with "echoai-v")
          TAG=$(gh release list --repo EchoWorker/EchoAIStore --limit 50 \
            --json tagName --jq '.[].tagName' | grep '^echoai-v' | head -n1)
          if [ -z "$TAG" ]; then
            echo "ERROR: No EchoAI release found!"
            exit 1
          fi
          echo "Downloading $ARCHIVE from release $TAG"
          mkdir -p echoai-artifact
          gh release download "$TAG" --repo EchoWorker/EchoAIStore \
            --pattern "$ARCHIVE" --dir echoai-artifact
          echo "Downloaded files:"
          ls -la echoai-artifact/
          # Export version for bundle step
          ECHOAI_VER=$(echo "$TAG" | sed 's/echoai-v//')
          echo "ECHOAI_DOWNLOADED_VERSION=$ECHOAI_VER" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Bundle EchoAI into EchoWork
        shell: bash
        run: |
          set -eo pipefail
          echo "=== Contents of echoai-artifact ==="
          ls -la echoai-artifact/
          mkdir -p src-tauri/echoai
          ARCHIVE="${{ matrix.echoai_archive }}"
          echo "Extracting $ARCHIVE ..."
          if [[ "$ARCHIVE" == *.zip ]]; then
            unzip "echoai-artifact/$ARCHIVE" -d src-tauri/echoai/
          else
            tar xzf "echoai-artifact/$ARCHIVE" -C src-tauri/echoai/
          fi
          echo "=== Bundled EchoAI files ==="
          find src-tauri/echoai -type f
          echo "=== EchoAI dir size ==="
          du -sh src-tauri/echoai/

          # Write version file for deployment logic
          if [ -n "${{ inputs.echoai_version }}" ]; then
            echo "${{ inputs.echoai_version }}" > src-tauri/echoai/version
          elif [ -n "$ECHOAI_DOWNLOADED_VERSION" ]; then
            echo "$ECHOAI_DOWNLOADED_VERSION" > src-tauri/echoai/version
          else
            echo "unknown" > src-tauri/echoai/version
          fi
          echo "=== EchoAI version ==="
          cat src-tauri/echoai/version

          # Bundle builtin plugin (echowork-plugin/) into echoai/plugins/echowork/
          #
          # The target is wiped first: `cp -r` only adds and overwrites, it never
          # removes. Anything already sitting there (an earlier EchoAI artifact, a
          # cached workspace) survives forever — which is how skills deleted or
          # renamed in the repo, e.g. app-dev -> app-builder, kept shipping to users
          # long after they were gone from source. The repo is the only source of
          # truth for this directory.
          if [ -d "echowork-plugin" ]; then
            rm -rf src-tauri/echoai/plugins/echowork
            mkdir -p src-tauri/echoai/plugins/echowork
            cp -r echowork-plugin/* src-tauri/echoai/plugins/echowork/
            echo "=== Bundled echowork plugin ==="
            find src-tauri/echoai/plugins -type f
            echo "=== Bundled skills (must match echowork-plugin/skills/) ==="
            ls -1 src-tauri/echoai/plugins/echowork/skills
          fi

      - name: Scan bundled EchoAI tree for models
        shell: bash
        run: |
          set -euo pipefail
          if find src-tauri/echoai -type f \( -name '*.onnx' -o -name 'tokenizer.json' \) -print -quit | grep -q . || find src-tauri/echoai -type d -name models -print -quit | grep -q .; then
            echo 'EchoWork would bundle forbidden model files' >&2; find src-tauri/echoai -print; exit 1
          fi

      - name: Sign bundled echoai binary (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - src-tauri/echoai/echoai
          echo "echoai binary ad-hoc signed"

      - name: Override version and enable resources
        shell: bash
        run: |
          set -eo pipefail
          VERSION="${{ inputs.echowork_version }}"
          echo "Setting version to $VERSION, enabling resources: ['echoai/']"
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = '$VERSION';
            j.bundle.resources = ['echoai/'];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('=== tauri.conf.json bundle section ===');
            console.log(JSON.stringify(j.bundle, null, 2));
          "
          node -e "
            const fs = require('fs');
            const p = 'package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = '$VERSION';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          python3 -c "
          import re
          p = 'src-tauri/Cargo.toml'
          src = open(p).read()
          new = re.sub(
              r'(\[package\][^\[]*?version\s*=\s*\")[^\"]+(\")',
              r'\g<1>$VERSION\g<2>',
              src,
              count=1,
              flags=re.DOTALL,
          )
          open(p, 'w').write(new)
          "

      - name: Verify config before build
        shell: bash
        run: |
          echo "=== tauri.conf.json (full bundle section) ==="
          node -e "const j=JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')); console.log(JSON.stringify(j.bundle, null, 2))"
          echo "=== echoai binary exists? ==="
          ls -la src-tauri/echoai/echoai* 2>/dev/null || ls -la src-tauri/echoai/echoai*.exe 2>/dev/null || echo "WARNING: echoai binary NOT found!"
          echo "=== echoai dir total ==="
          du -sh src-tauri/echoai/

      - name: Clean stale bundle outputs
        shell: bash
        run: |
          # bundle/ dir is restored from cache and may contain prior-version
          # installers (e.g. EchoWork_0.2.0_x64-setup.exe) that would otherwise
          # be picked up by the wildcard cp in "Collect artifacts".
          rm -rf src-tauri/target/${{ matrix.target }}/release/bundle
          echo "Removed stale bundle directory"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5.25
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe       dist-artifacts/ 2>/dev/null || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.nsis.zip  dist-artifacts/ 2>/dev/null || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig       dist-artifacts/ 2>/dev/null || true
          else
            cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg              dist-artifacts/ 2>/dev/null || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz     dist-artifacts/ 2>/dev/null || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig dist-artifacts/ 2>/dev/null || true
          fi
          ls -la dist-artifacts/

      - name: Scan EchoWork installers for bundled models
        shell: bash
        run: |
          set -euo pipefail
          rm -rf installer-scan && mkdir installer-scan
          if [ "${{ runner.os }}" = "Windows" ]; then
            installer=$(find dist-artifacts -maxdepth 1 -name '*.exe' -print -quit)
            7z x -y "$installer" -oinstaller-scan >/dev/null
          else
            bundle=$(find dist-artifacts -maxdepth 1 -name '*.app.tar.gz' -print -quit)
            tar xzf "$bundle" -C installer-scan
          fi
          if find installer-scan -type f \( -name '*.onnx' -o -name 'tokenizer.json' \) -print -quit | grep -q . || find installer-scan -type d -name models -print -quit | grep -q .; then
            echo 'EchoWork installer contains forbidden model files' >&2; find installer-scan -print; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: echowork-${{ matrix.platform }}
          path: dist-artifacts/*
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Publish EchoAI
  # ─────────────────────────────────────────────
  publish-echoai:
    if: github.event_name == 'workflow_dispatch' && inputs.echoai_version != ''
    name: Publish EchoAI
    needs: build-echoai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: echoai-windows-x64.zip
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: echoai-linux-x64.tar.gz
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: echoai-darwin-arm64.tar.gz
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sh -c '
            for f; do sha256sum "$f" | sed "s|  .*/|  |" >> checksums.sha256; done
          ' _ {} +
          cat checksums.sha256

      - name: Create EchoAI release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: echoai-v${{ inputs.echoai_version }}
          name: EchoAI v${{ inputs.echoai_version }}
          body: |
            ## EchoAI v${{ inputs.echoai_version }}

            ### Install

            **macOS / Linux:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/EchoWorker/EchoAIStore/main/EchoAI/install.sh | sh
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/EchoWorker/EchoAIStore/main/EchoAI/install.ps1 | iex
            ```
          files: |
            artifacts/**/*

  # ─────────────────────────────────────────────
  # Publish EchoCode
  # ─────────────────────────────────────────────
  publish-echocode:
    if: github.event_name == 'workflow_dispatch' && inputs.echocode_version != ''
    name: Publish EchoCode
    needs: build-echocode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: echocode-windows-x64.zip
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: echocode-linux-x64.tar.gz
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: echocode-darwin-arm64.tar.gz
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sh -c '
            for f; do sha256sum "$f" | sed "s|  .*/|  |" >> checksums.sha256; done
          ' _ {} +
          cat checksums.sha256

      - name: Create EchoCode release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: echocode-v${{ inputs.echocode_version }}
          name: EchoCode v${{ inputs.echocode_version }}
          body: |
            ## EchoCode v${{ inputs.echocode_version }}

            ### Download

            | Platform | Archive |
            |----------|---------|
            | Windows x64 | `echocode-windows-x64.zip` |
            | Linux x64 | `echocode-linux-x64.tar.gz` |
            | macOS ARM64 | `echocode-darwin-arm64.tar.gz` |
          files: |
            artifacts/**/*

  # ─────────────────────────────────────────────
  # Publish OfficeCli
  # ─────────────────────────────────────────────
  publish-officecli:
    if: github.event_name == 'workflow_dispatch' && inputs.officecli_version != ''
    name: Publish OfficeCli
    needs: build-officecli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: officecli-windows-x64.zip
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: officecli-linux-x64.tar.gz
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: officecli-darwin-arm64.tar.gz
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sh -c '
            for f; do sha256sum "$f" | sed "s|  .*/|  |" >> checksums.sha256; done
          ' _ {} +
          cat checksums.sha256

      - name: Create OfficeCli release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: officecli-v${{ inputs.officecli_version }}
          name: OfficeCli v${{ inputs.officecli_version }}
          body: |
            ## OfficeCli v${{ inputs.officecli_version }}

            ### Download

            | Platform | Archive |
            |----------|---------|
            | Windows x64 | `officecli-windows-x64.zip` |
            | Linux x64 | `officecli-linux-x64.tar.gz` |
            | macOS ARM64 | `officecli-darwin-arm64.tar.gz` |
          files: |
            artifacts/**/*

  # ─────────────────────────────────────────────
  # Publish EchoWork
  # ─────────────────────────────────────────────
  publish-echowork:
    if: ${{ github.event_name == 'workflow_dispatch' && !failure() && !cancelled() && inputs.echowork_version != '' }}
    name: Publish EchoWork
    needs: build-echowork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: echowork-windows-x64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: echowork-macos-arm
          path: artifacts

      - name: Generate latest.json
        id: manifest
        shell: bash
        run: |
          set -eo pipefail
          VERSION="${{ inputs.echowork_version }}"
          TAG="echowork-v${VERSION}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE_URL="https://github.com/EchoWorker/EchoAIStore/releases/download/${TAG}"

          find_one() {
            local found
            found=$(find artifacts -type f -name "$1" | head -n1)
            if [ -z "$found" ]; then echo "ERROR: missing $2" >&2; find artifacts -type f >&2; exit 1; fi
            echo "$found"
          }

          WIN_BUNDLE=$(find_one '*-setup.exe' 'Windows installer')
          WIN_SIG=$(cat "$(find_one '*-setup.exe.sig' 'Windows sig')")
          MAC_TAR=$(find_one '*.app.tar.gz' 'macOS bundle')
          MAC_SIG=$(cat "$(find_one '*.app.tar.gz.sig' 'macOS sig')")

          jq -n \
            --arg version "$VERSION" \
            --arg notes "EchoWork v${VERSION}" \
            --arg pub_date "$PUB_DATE" \
            --arg win_sig "$WIN_SIG" \
            --arg win_url "${BASE_URL}/$(basename $WIN_BUNDLE)" \
            --arg mac_sig "$MAC_SIG" \
            --arg mac_url "${BASE_URL}/$(basename $MAC_TAR)" \
            '{
              version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url }
              }
            }' > latest.json

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.exe' -o -name '*.nsis.zip' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} release-files/ \;
          cp latest.json release-files/
          ls -la release-files/

      - name: Create EchoWork release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: echowork-v${{ inputs.echowork_version }}
          name: EchoWork v${{ inputs.echowork_version }}
          body: |
            ## EchoWork v${{ inputs.echowork_version }}

            Includes EchoAI backend (bundled).
          files: release-files/*

      - name: Update echowork-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fully remove old echowork-latest (release + tag) before recreating
          gh release delete echowork-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create echowork-latest \
            --title "EchoWork Latest (v${{ inputs.echowork_version }})" \
            --notes "Auto-updater pointer release." \
            release-files/*
