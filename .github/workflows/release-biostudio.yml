name: Release BioStudio

on:
  workflow_dispatch:
    inputs:
      biostudio_version:
        description: 'BioStudio version (strict SemVer, e.g. 1.2.3)'
        required: true
        type: string
      echoai_version:
        description: 'EchoAI version to bundle (strict SemVer; empty uses latest stable release)'
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-biostudio
  cancel-in-progress: false

env:
  BIOSTUDIO_REPOSITORY: EchoWorker/BioStudio

jobs:
  prepare:
    name: Validate and resolve inputs
    runs-on: ubuntu-latest
    outputs:
      biostudio_ref: ${{ steps.source.outputs.biostudio_ref }}
      echoai_version: ${{ steps.resolve.outputs.echoai_version }}
      echoai_tag: ${{ steps.resolve.outputs.echoai_tag }}
    steps:
      - name: Resolve BioStudio source SHA
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${BIOSTUDIO_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid BioStudio source SHA: $sha" >&2; exit 1; }
          echo "biostudio_ref=$sha" >> "$GITHUB_OUTPUT"
          echo "- BioStudio source: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate versions, release immutability, and EchoAI release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          BIOSTUDIO_VERSION: ${{ inputs.biostudio_version }}
          REQUESTED_ECHOAI_VERSION: ${{ inputs.echoai_version }}
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          [[ "$BIOSTUDIO_VERSION" =~ $semver ]] || { echo "Invalid strict SemVer: $BIOSTUDIO_VERSION" >&2; exit 1; }
          if [[ -n "$REQUESTED_ECHOAI_VERSION" ]]; then
            [[ "$REQUESTED_ECHOAI_VERSION" =~ $semver ]] || { echo "Invalid EchoAI strict SemVer: $REQUESTED_ECHOAI_VERSION" >&2; exit 1; }
          fi

          tag="biostudio-v${BIOSTUDIO_VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1 || \
             gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to modify immutable release $tag" >&2
            exit 1
          fi

          if [[ -n "$REQUESTED_ECHOAI_VERSION" ]]; then
            echoai_tag="echoai-v${REQUESTED_ECHOAI_VERSION}"
            release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${echoai_tag}")
            [[ $(jq -r '.draft // false' <<<"$release") == false ]] || { echo "$echoai_tag is a draft" >&2; exit 1; }
            echoai_version="$REQUESTED_ECHOAI_VERSION"
          else
            release=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
            echoai_tag=$(jq -r '[.[] | select((.draft | not) and (.prerelease | not) and (.tag_name | test("^echoai-v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$")))][0].tag_name // empty' <<<"$release")
            [[ -n "$echoai_tag" ]] || { echo 'No stable EchoAI release found' >&2; exit 1; }
            release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${echoai_tag}")
            echoai_version="${echoai_tag#echoai-v}"
          fi

          assets=$(jq -r '.assets[].name' <<<"$release")
          if [[ -n "$assets" ]]; then
            grep -Fxq 'echoai-windows-x64.zip' <<<"$assets" || { echo "$echoai_tag lacks Windows x64" >&2; exit 1; }
            grep -Fxq 'echoai-darwin-arm64.tar.gz' <<<"$assets" || { echo "$echoai_tag lacks macOS arm64" >&2; exit 1; }
          fi
          echo "echoai_version=$echoai_version" >> "$GITHUB_OUTPUT"
          echo "echoai_tag=$echoai_tag" >> "$GITHUB_OUTPUT"
          {
            echo '### Release inputs'
            echo "- BioStudio: \`$BIOSTUDIO_VERSION\`"
            echo "- EchoAI: \`$echoai_tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: BioStudio (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            echoai_archive: echoai-windows-x64.zip
          - platform: macos-arm
            os: macos-14
            target: aarch64-apple-darwin
            echoai_archive: echoai-darwin-arm64.tar.gz
    steps:
      - name: Checkout pinned BioStudio source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BIOSTUDIO_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.biostudio_ref }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.prepare.outputs.biostudio_ref }}'
          echo "- BioStudio (${{ matrix.platform }}): \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: biostudio-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: biostudio-${{ matrix.target }}-

      - name: Authenticate private Cargo dependencies
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Set and verify all four versions
        shell: bash
        env:
          VERSION: ${{ inputs.biostudio_version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          for (const p of ['package.json', 'package-lock.json']) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = version;
            if (p === 'package-lock.json' && j.packages?.['']) j.packages[''].version = version;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          }
          const p = 'src-tauri/tauri.conf.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.version = version;
          j.bundle.resources = ['echoai/'];
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          NODE
          python3 - <<'PY'
          import os, re
          p = 'src-tauri/Cargo.toml'
          text = open(p, encoding='utf-8').read()
          text, count = re.subn(r'(\[package\][^\[]*?version\s*=\s*")[^"]+("[^\n]*\n)', rf'\g<1>{os.environ["VERSION"]}\g<2>', text, count=1, flags=re.S)
          if count != 1: raise SystemExit('failed to set Cargo package version')
          open(p, 'w', encoding='utf-8').write(text)
          PY
          node <<'NODE'
          const fs = require('fs');
          const expected = process.env.VERSION;
          const values = {
            package: JSON.parse(fs.readFileSync('package.json')).version,
            lock: JSON.parse(fs.readFileSync('package-lock.json')).version,
            lockRoot: JSON.parse(fs.readFileSync('package-lock.json')).packages?.['']?.version,
            tauri: JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).version,
            cargo: fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1]
          };
          if (Object.values(values).some(v => v !== expected)) throw new Error(`version mismatch: ${JSON.stringify(values)}`);
          const resources = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).bundle.resources;
          if (JSON.stringify(resources) !== JSON.stringify(['echoai/'])) throw new Error(`unexpected resources: ${JSON.stringify(resources)}`);
          console.log(values, {resources});
          NODE

      - run: npm ci

      - name: Download EchoAI artifact from this run or a stable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          ECHOAI_TAG: ${{ needs.prepare.outputs.echoai_tag }}
        run: |
          set -euo pipefail
          archive='${{ matrix.echoai_archive }}'
          mkdir echoai-artifact
          echo "Downloading $archive from release $ECHOAI_TAG"
          gh release download "$ECHOAI_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --dir echoai-artifact
          test -f "echoai-artifact/$archive"

      - name: Clean and embed EchoAI and BioStudio plugin
        shell: bash
        env:
          ECHOAI_VERSION: ${{ needs.prepare.outputs.echoai_version }}
        run: |
          set -euo pipefail
          rm -rf src-tauri/echoai
          mkdir -p src-tauri/echoai
          archive='echoai-artifact/${{ matrix.echoai_archive }}'
          case "$archive" in *.zip) unzip -q "$archive" -d src-tauri/echoai;; *) tar xzf "$archive" -C src-tauri/echoai;; esac
          printf '%s\n' "$ECHOAI_VERSION" > src-tauri/echoai/version
          rm -rf src-tauri/echoai/plugins/biostudio
          mkdir -p src-tauri/echoai/plugins/biostudio
          cp -R biostudio-plugin/. src-tauri/echoai/plugins/biostudio/
          node scripts/generate-biostudio-plugin-manifest.mjs \
            --source biostudio-plugin --output src-tauri/echoai/plugins/biostudio-files.json
          node scripts/generate-biostudio-plugin-manifest.mjs \
            --source biostudio-plugin --output src-tauri/echoai/plugins/biostudio-files.json --check

      - name: Scan bundled tree for models
        shell: bash
        run: |
          set -euo pipefail
          if find src-tauri/echoai -type f \( -name '*.onnx' -o -name 'tokenizer.json' \) -print -quit | grep -q . || \
             find src-tauri/echoai -type d -name models -print -quit | grep -q .; then
            echo 'BioStudio would bundle forbidden model files' >&2
            find src-tauri/echoai -print >&2
            exit 1
          fi

      - name: Sign bundled EchoAI binary (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - src-tauri/echoai/echoai

      - name: Clean stale bundle outputs
        shell: bash
        run: rm -rf src-tauri/target/${{ matrix.target }}/release/bundle

      - name: Build Tauri app and sign updater artifacts
        uses: tauri-apps/tauri-action@v0.5.25
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}

      - name: Collect and scan artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist-artifacts
          if [[ '${{ runner.os }}' == Windows ]]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist-artifacts/
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig dist-artifacts/
            installer=$(find dist-artifacts -maxdepth 1 -name '*.exe' -print -quit)
            test -n "$installer"
            mkdir installer-scan
            7z x -y "$installer" -oinstaller-scan >/dev/null
          else
            cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist-artifacts/
            cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz dist-artifacts/
            cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig dist-artifacts/
            bundle=$(find dist-artifacts -maxdepth 1 -name '*.app.tar.gz' -print -quit)
            test -n "$bundle"
            mkdir installer-scan
            tar xzf "$bundle" -C installer-scan
          fi
          if find installer-scan -type f \( -name '*.onnx' -o -name 'tokenizer.json' \) -print -quit | grep -q . || \
             find installer-scan -type d -name models -print -quit | grep -q .; then
            echo 'BioStudio installer contains forbidden model files' >&2
            exit 1
          fi
          find dist-artifacts -maxdepth 1 -type f -print

      - uses: actions/upload-artifact@v4
        with:
          name: biostudio-${{ matrix.platform }}
          path: dist-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish BioStudio
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: biostudio-*
          path: artifacts

      - name: Generate updater manifest and release files
        shell: bash
        env:
          VERSION: ${{ inputs.biostudio_version }}
        run: |
          set -euo pipefail
          tag="biostudio-v${VERSION}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          find_one() { local f; f=$(find artifacts -type f -name "$1" -print -quit); [[ -n "$f" ]] || { echo "Missing $2" >&2; exit 1; }; printf '%s\n' "$f"; }
          win=$(find_one '*-setup.exe' 'Windows installer')
          win_sig=$(cat "$(find_one '*-setup.exe.sig' 'Windows signature')")
          mac=$(find_one '*.app.tar.gz' 'macOS updater bundle')
          mac_sig=$(cat "$(find_one '*.app.tar.gz.sig' 'macOS signature')")
          jq -n --arg version "$VERSION" --arg notes "BioStudio v${VERSION}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_sig "$win_sig" --arg win_url "$base/$(basename "$win")" \
            --arg mac_sig "$mac_sig" --arg mac_url "$base/$(basename "$mac")" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{"windows-x86_64":{signature:$win_sig,url:$win_url},"darwin-aarch64":{signature:$mac_sig,url:$mac_url}}}' > latest.json
          mkdir release-files
          find artifacts -type f \( -name '*.exe' -o -name '*.nsis.zip' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} release-files/ \;
          cp latest.json release-files/
          test "$(find release-files -maxdepth 1 -name '*.exe' | wc -l)" -ge 1
          test "$(find release-files -maxdepth 1 -name '*.app.tar.gz' | wc -l)" -ge 1
          cat latest.json

      - name: Create immutable versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: biostudio-v${{ inputs.biostudio_version }}
          name: BioStudio v${{ inputs.biostudio_version }}
          body: |
            ## BioStudio v${{ inputs.biostudio_version }}

            Includes EchoAI v${{ needs.prepare.outputs.echoai_version }} and the BioStudio plugin.
          files: release-files/*

      - name: Update biostudio-latest pointer release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view biostudio-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload biostudio-latest --repo "$GITHUB_REPOSITORY" --clobber release-files/*
            gh release edit biostudio-latest --repo "$GITHUB_REPOSITORY" \
              --title 'BioStudio Latest (v${{ inputs.biostudio_version }})' \
              --notes 'Auto-updater pointer release.'
          else
            gh release create biostudio-latest --repo "$GITHUB_REPOSITORY" \
              --title 'BioStudio Latest (v${{ inputs.biostudio_version }})' \
              --notes 'Auto-updater pointer release.' release-files/*
          fi
